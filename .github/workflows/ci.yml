name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la app
          ls -la app/pharmaops-api

      - name: Build & Test (Maven)
        working-directory: app/pharmaops-api
        run: mvn -B clean verify
