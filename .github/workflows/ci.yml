name: CI - Build, Test, Security & Image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  APP_DIR: app/pharmaops-api
  JAVA_VERSION: "21"
  IMAGE_NAME: pharmaops-api
  DOCKERHUB_NAMESPACE: karl123
  IMAGE_REPOSITORY: karl123/pharmaops-api

jobs:
  build-test:
    name: Build & Test - Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        working-directory: ${{ env.APP_DIR }}
        run: mvn -B clean verify

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif .

      - name: Upload Semgrep SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  sca-trivy:
    name: SCA - Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem SCA scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      - name: Upload Trivy filesystem SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-sca-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore

  docker-image-security-and-push:
    name: Docker image scan & push
    runs-on: ubuntu-latest
    needs:
      - build-test
      - sast-semgrep
      - sca-trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: |
          docker build \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:latest" \
            "${APP_DIR}"

      - name: Run Trivy image SCA scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload Trivy image SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Upload Trivy image SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sca-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Scout CVE scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          only-severities: critical,high
          only-package-types: maven
          only-fixed: true
          sarif-file: docker-scout.sarif
          write-comment: false
          exit-code: false

      - name: Upload Docker Scout SARIF to GitHub code scanning
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: docker-scout.sarif

      - name: Upload Docker Scout SARIF artifact
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-sca-sarif
          path: docker-scout.sarif
          if-no-files-found: ignore

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker push "${IMAGE_REPOSITORY}:latest"
